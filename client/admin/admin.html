<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--
        The admin page lives in the /admin/ sub-folder but must reuse the same
        shared header/nav/footer (common.js) as the public site. Setting the
        document base to the site root means the relative links generated by
        common.js (index.html, search.html) still resolve correctly here, and
        lets every asset reference an absolute path.
    -->
    <base href="/">
    <title>Admin Dashboard - Charity Events</title>
    <!-- Shared theme (buttons, forms, navbar, footer, base palette) -->
    <link rel="stylesheet" href="/css/style.css">
    <!-- Admin-specific layout (dashboard, table, form grid) -->
    <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body>

    <!-- Shared navigation bar (rendered by common.js, same as the public site) -->
    <div id="navbar"></div>

    <div class="admin-wrap">

        <div class="admin-header">
            <div>
                <h1 class="admin-title">Events Dashboard</h1>
                <p class="admin-sub">Create, edit and remove charity events.</p>
            </div>
            <div class="admin-header-actions">
                <a class="btn btn-ghost" href="/index.html" target="_blank" rel="noopener">View Public Site</a>
                <button class="btn btn-primary" id="newEventBtn">+ New Event</button>
            </div>
        </div>

        <!-- Global status / error message -->
        <div id="adminMessage" class="admin-message" style="display:none;"></div>

        <!-- Create / Edit form -->
        <div class="panel" id="eventFormCard" style="display:none;">
            <h2 class="panel-heading" id="formHeading">Create New Event</h2>
            <form id="eventForm" novalidate>
                <div class="form-grid">
                    <div class="form-group span-2">
                        <label for="title">Event Title <span class="req">*</span></label>
                        <input type="text" id="title" maxlength="200" placeholder="e.g. Annual Charity Gala Dinner 2026" required>
                    </div>

                    <div class="form-group">
                        <label for="organization">Organization <span class="req">*</span></label>
                        <select id="organization" required></select>
                    </div>

                    <div class="form-group">
                        <label for="category">Category <span class="req">*</span></label>
                        <select id="category" required></select>
                    </div>

                    <div class="form-group">
                        <label for="eventDate">Event Date &amp; Time <span class="req">*</span></label>
                        <input type="datetime-local" id="eventDate" required>
                    </div>

                    <div class="form-group">
                        <label for="location">Location <span class="req">*</span></label>
                        <input type="text" id="location" maxlength="300" placeholder="e.g. Sydney Convention Centre, Sydney NSW" required>
                    </div>

                    <div class="form-group">
                        <label for="ticketPrice">Ticket Price (AUD)</label>
                        <input type="number" id="ticketPrice" min="0" step="0.01" value="0">
                    </div>

                    <div class="form-group">
                        <label for="status">Status</label>
                        <select id="status">
                            <option value="upcoming">upcoming</option>
                            <option value="ongoing">ongoing</option>
                            <option value="completed">completed</option>
                            <option value="paused">paused</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="targetAmount">Target Amount (AUD)</label>
                        <input type="number" id="targetAmount" min="0" step="0.01" value="0">
                    </div>

                    <div class="form-group">
                        <label for="raisedAmount">Raised Amount (AUD)</label>
                        <input type="number" id="raisedAmount" min="0" step="0.01" value="0">
                    </div>

                    <div class="form-group span-2">
                        <label for="imageUrl">Event Image</label>
                        <select id="imageUrl"></select>
                        <div id="imagePreview" class="image-preview" style="display:none;">
                            <img id="imagePreviewImg" src="" alt="selected event image">
                        </div>
                    </div>

                    <div class="form-group span-2">
                        <label for="description">Description</label>
                        <textarea id="description" rows="4" placeholder="Describe what the event is about..."></textarea>
                    </div>
                </div>

                <div class="form-error" id="formError" style="display:none;"></div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" id="saveBtn">Create Event</button>
                    <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
                </div>
            </form>
        </div>

        <!-- Events listing -->
        <div class="panel">
            <div class="panel-title-row">
                <h2 class="panel-heading">All Events</h2>
                <span id="listCount" class="list-count"></span>
            </div>
            <p class="list-note">Showing active events (upcoming &amp; ongoing).</p>
            <div id="eventsTableContainer">
                <p class="loading">Loading events...</p>
            </div>
        </div>

    </div>

    <!-- Shared footer (rendered by common.js, same as the public site) -->
    <div id="footer"></div>

    <!-- Shared helpers first, then admin logic -->
    <script src="/js/common.js"></script>
    <script src="/admin/js/admin.js"></script>
</body>
</html>

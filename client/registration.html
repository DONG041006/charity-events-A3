<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Charity Events</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header / Nav rendered by JS -->
    <div id="navbar"></div>

    <div class="container">
        <h2 class="page-title">Event Registration</h2>

        <!-- Event information loaded by JS from the API -->
        <div id="event-info" class="loading">Loading event information...</div>

        <!-- Registration form -->
        <h3 style="margin-top: 2rem;">Your Details</h3>
        <form id="registration-form" class="registration-form" novalidate>
            <div class="form-field">
                <label for="full-name">Full Name *</label>
                <input type="text" id="full-name" name="full_name" required>
            </div>
            <div class="form-field">
                <label for="email">Email *</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-field">
                <label for="phone">Phone</label>
                <input type="tel" id="phone" name="phone">
            </div>
            <div class="form-field">
                <label for="tickets">Number of Tickets *</label>
                <input type="number" id="tickets" name="tickets" min="1" value="1" required>
            </div>
            <div style="margin-top: 1.5rem;">
                <button type="submit" class="btn btn-primary" style="padding: 0.8rem 3rem; font-size: 1.05rem;">
                    Confirm Registration
                </button>
                <a href="javascript:history.back()" class="btn btn-secondary">Back</a>
            </div>
        </form>

        <!-- Confirmation / error message shown here after submit -->
        <div id="form-message" style="margin-top: 1.5rem;"></div>
    </div>

    <!-- Footer rendered by JS -->
    <div id="footer"></div>

    <script src="js/common.js"></script>
    <script src="js/registration.js"></script>
</body>
</html>
